<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" preserveAspectRatio="none" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a506b"/>
      <stop offset="1" stop-color="#0b132b"/>
    </linearGradient>
    <path id="wave" d="M0 50 Q150 10 300 50 T600 50 T900 50 T1200 50 T1500 50 T1800 50 T2100 50 T2400 50 T2700 50 T3000 50 L3000 110 L0 110 Z"/>
    <style>
      .w1 { animation: slide 14s linear infinite; }
      .w2 { animation: slide 9s linear infinite reverse; }
      .w3 { animation: slide 6s linear infinite; }
      @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    </style>
  </defs>
  <g class="w1" opacity="0.35"><use href="#wave" fill="#5bc0be" transform="translate(0 -6)"/></g>
  <g class="w2" opacity="0.5"><use href="#wave" fill="#3a506b" transform="translate(-400 6)"/></g>
  <g class="w3"><use href="#wave" fill="url(#bg)" transform="translate(-800 18)"/></g>
</svg>
