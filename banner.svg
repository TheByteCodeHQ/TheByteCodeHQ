<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Sujyonta Kumar Giri, Engineering Leader">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="0.55" stop-color="#1c2541"/>
      <stop offset="1" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5bc0be"/>
      <stop offset="1" stop-color="#6fffe9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="28 28" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="280"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; text-anchor: middle; }
      .rise { opacity: 0; animation: rise 1s ease-out forwards; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .55s; } .d3 { animation-delay: .95s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .bar { transform-origin: 600px 134px; transform: scaleX(0); animation: grow .9s .4s ease-out forwards; }
      @keyframes grow { to { transform: scaleX(1); } }
      .float1 { animation: f1 9s ease-in-out infinite alternate; }
      .float2 { animation: f2 11s ease-in-out infinite alternate; }
      @keyframes f1 { to { transform: translate(-70px, 40px); } }
      @keyframes f2 { to { transform: translate(60px, -35px); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#dots)"/>
    <circle class="float1" cx="1080" cy="40" r="150" fill="#5bc0be" fill-opacity="0.09"/>
    <circle class="float2" cx="1140" cy="250" r="110" fill="#6fffe9" fill-opacity="0.07"/>
    <circle class="float2" cx="90" cy="230" r="120" fill="#5bc0be" fill-opacity="0.06"/>
    <circle class="pulse" cx="170" cy="60" r="3" fill="#6fffe9"/>
    <circle class="pulse" cx="1010" cy="200" r="3" fill="#6fffe9" style="animation-delay:.8s"/>
    <circle class="pulse" cx="320" cy="235" r="2.5" fill="#ffffff" style="animation-delay:1.5s"/>
    <circle class="pulse" cx="880" cy="50" r="2.5" fill="#ffffff" style="animation-delay:.4s"/>

    <text class="t rise d1" x="600" y="112" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="1">Sujyonta Kumar Giri</text>
    <rect class="bar" x="560" y="132" width="80" height="4" rx="2" fill="url(#accent)"/>
    <text class="t rise d2" x="600" y="176" font-size="22" font-weight="600" fill="#6fffe9" letter-spacing="4">ENGINEERING LEADER</text>
    <text class="t rise d3" x="600" y="218" font-size="17" fill="#c9d6e8" letter-spacing="1.5">Development  ·  QA &amp; Automation  ·  DevOps &amp; Cloud  ·  Agentic AI</text>

    <rect x="-300" y="0" width="300" height="280" fill="url(#shine)" opacity="0.08">
      <animate attributeName="x" from="-300" to="1200" dur="5s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
